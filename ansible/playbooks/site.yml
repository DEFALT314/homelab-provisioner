---
- name: Wait for hosts to become reachable
  hosts: docker_hosts
  gather_facts: false
  tasks:
    - name: Wait for SSH
      ansible.builtin.wait_for_connection:
        timeout: 300
        delay: 10

- name: Install Docker and deploy services
  hosts: docker_hosts
  roles:
    - docker
    - docker_service

- name: Configure Nginx Proxy Manager
  hosts: localhost
  connection: local
  gather_facts: false
  roles:
    - nginx_proxy_manager
